services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: BancoUniversitarioDB
      POSTGRES_USER: banco
      POSTGRES_PASSWORD: banco123
    volumes:
      - banco_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banco -d BancoUniversitarioDB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: junajpu616/banco-api:v1
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=BancoUniversitarioDB;Username=banco;Password=banco123
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    image: junajpu616/banco-frontend:v1
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/api
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000"

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend

volumes:
  banco_data:
